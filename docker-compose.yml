services:

  postgres:
    container_name: postgres
    build:
      context: .
      dockerfile: Dockerfile.adianti-db
    environment:
      POSTGRES_DB: atendente
      POSTGRES_USER: atendente
      POSTGRES_PASSWORD: atendente123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./admin-panel/app/database:/docker-entrypoint-initdb.d:ro  # Copia os arquivos SQL para inicialização do PostgreSQL
    ports:
      - "5432:5432"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=atendente
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n123
      - DB_POSTGRESDB_SCHEMA=n8n
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - EVOLUTION_API_BASE_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=change-me
      - EVOLUTION_INSTANCE=YOUR_INSTANCE
      - ADIANTI_REST_URL=http://adianti/rest.php
      - RAG_TOP_K=5
      - RAG_MIN_SIMILARITY=0.75
      - WA_SELF_TEST_PHONE=5515998485006
      - WA_SELF_TEST_PREFIX=/bot

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      - postgres

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http --log=stdout n8n:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - n8n
    profiles:
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n
    profiles:
      - tunnel

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8090:8080"
    env_file:
      - ./evolution-api.env
    environment:
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/evolution-ai-agent
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - n8n
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adianti:
    build:
      context: ./admin-panel
      dockerfile: ../Dockerfile.adianti
    container_name: adianti
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: atendente
      DATABASE_USER: atendente
      DATABASE_PASSWORD: atendente123
      EVOLUTION_API_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: change-me
    volumes:
      - ./admin-panel:/var/www/html
      - ./admin-panel/php/php.ini:/usr/local/etc/php/php.ini
    ports:
      - "8081:80"
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "5050:80"  # Acessível via http://localhost:5050
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro  # Pré-configura servidor PostgreSQL do compose
volumes:
  postgres_data:
  pgadmin_data:  # Definição do volume que estava faltando
  pg_data:
  n8n_data:
  evolution_instances:
  redis_data:
